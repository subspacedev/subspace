name: Set up the Android build
description: >-
  Toolchain and native inputs shared by ci.yml and reproducible.yml: two JDKs,
  Gradle toolchain detection, the pinned SDK and NDK, Gradle, and the libXray AAR.
  The caller checks out the repository (with submodules) first.

runs:
  using: composite
  steps:
    # Two JDKs. Gradle itself must run on 21: gradle/gradle-daemon-jvm.properties
    # pins toolchainVersion=21 because Paparazzi 2.0 needs it. The modules still
    # compile against a 17 toolchain (jvmToolchain(17) in build-logic and
    # subspace.jvm), and no toolchain download repository is configured, so 17
    # has to be on the machine too. setup-java exports the last version listed
    # as JAVA_HOME, so 21 goes last; both are also exported as
    # JAVA_HOME_<v>_X64, which the next step hands to Gradle's toolchain
    # detection explicitly rather than trusting it to find /opt/hostedtoolcache.
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: |
          17
          21

    - name: Point Gradle toolchain detection at both JDKs
      shell: bash
      run: |
        mkdir -p ~/.gradle
        echo 'org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64' >> ~/.gradle/gradle.properties

    # compileSdk is 37.1 — release(37) { minorApiLevel = 1 } in
    # app/build.gradle.kts and subspace.android.library. The Compose
    # 1.13.0-alpha artifacts behind the M8.6 Material 3 Expressive work require
    # it, so the package below is `platforms;android-37.1`.
    #
    # The package is minor-versioned, NOT `platforms;android-37`.
    # Google's repository2-3.xml ships android-36, android-36.1,
    # android-37.0, android-37.1 and android-37.2-beta1 — minor-versioned
    # platforms began at 36.1, and there has never been a bare android-37.
    # Asking for one fails the whole job in ~20s with a single
    # "Failed to find package" line buried under the licence text.
    #
    # This is easy to miss locally: Android Studio creates a
    # platforms/android-37 SYMLINK pointing at a minor-versioned platform, so a dev
    # machine resolves the non-existent name happily and CI does not.
    # An earlier version of this file claimed the runner "already ships
    # platforms;android-37, verified 2026-07-25". It does not, and never
    # could have — the claim was never actually checked against the
    # repository manifest. §10.5: a claim about upstream without a source
    # is a guess.
    #
    # Licences are accepted here, so AGP's own SDK auto-download can fill
    # any remaining gap rather than failing the build.
    - name: Install Android SDK platform 37
      uses: android-actions/setup-android@v4
      with:
        # The NDK pinned as `ndk` in gradle/libs.versions.toml (ndkVersion in :service and
        # :app): it builds hev-socks5-tunnel's JNI and strips every packaged .so. Keep the
        # two in step. The r29 this line used to install was never used: with no
        # ndkVersion set, AGP 9.3.1 picked its default, 28.2.13676358.
        packages: 'platform-tools platforms;android-37.1 build-tools;37.0.0 ndk;28.2.13676358'

    - uses: gradle/actions/setup-gradle@v4

    # The libXray AAR is ~55 MB and gitignored (§10.7), so a fresh clone
    # does not have it and :core:xray cannot resolve its dependency. The
    # official release asset is fetched and checked against the SHA-256
    # pinned in the script.
    - name: Fetch pinned libXray AAR
      shell: bash
      run: ./scripts/fetch-native.sh
