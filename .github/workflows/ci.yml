name: CI

on:
  # All branches, not just main: pushing a branch is itself the first proof
  # this workflow runs at all on GitHub infrastructure — it has never
  # executed there before. Narrow this back to branches: [main] only once
  # that is no longer in doubt.
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # submodules: recursive is required, not optional. hev-socks5-tunnel is
      # a submodule (see .gitmodules) and :service's ndk-build compiles its
      # sources directly. Without this the checkout leaves third_party/
      # hev-socks5-tunnel empty and the native build fails — or worse, trips
      # the Android.mk guard that exists to catch exactly this.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-android-build

      # Task 7 adds its own script tests to this step.
      - name: Test the APK comparison script
        run: scripts/test-compare-apks.sh

      - name: Verify module boundaries, format, static analysis, licence headers
        run: ./gradlew checkAll

      # `build` (assemble + check), not `assembleDebug`: the release variant
      # is where R8/minification runs, and assembleDebug never exercises
      # that path. A missing proguard-rules.pro sat green through seven
      # task reviews for exactly this reason — every prior verification
      # used checkAll or assembleDebug, never `build`.
      #
      # `check` includes :core:ui's verifyPaparazziDebug. The committed goldens
      # were recorded on macOS; Linux font rasterisation can differ enough to
      # trip a text-heavy golden. If one fails here and not locally, that is the
      # likely cause — compare the diff image before re-recording, and do not
      # loosen the comparison threshold to make it pass.
      - name: Build (assemble + check, including the release/R8 path)
        run: ./gradlew build

      - name: Unit tests
        run: ./gradlew test
