name: CI

on:
  # All branches, not just main: pushing a branch is itself the first proof
  # this workflow runs at all on GitHub infrastructure — it has never
  # executed there before. Narrow this back to branches: [main] only once
  # that is no longer in doubt.
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # submodules: recursive is required, not optional. hev-socks5-tunnel is
      # a submodule (see .gitmodules) and :service's ndk-build compiles its
      # sources directly. Without this the checkout leaves third_party/
      # hev-socks5-tunnel empty and the native build fails — or worse, trips
      # the Android.mk guard that exists to catch exactly this.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Two JDKs. Gradle itself must run on 21: gradle/gradle-daemon-jvm.properties
      # pins toolchainVersion=21 because Paparazzi 2.0 needs it. The modules still
      # compile against a 17 toolchain (jvmToolchain(17) in build-logic and
      # subspace.jvm), and no toolchain download repository is configured, so 17
      # has to be on the machine too. setup-java exports the last version listed
      # as JAVA_HOME, so 21 goes last; both are also exported as
      # JAVA_HOME_<v>_X64, which the next step hands to Gradle's toolchain
      # detection explicitly rather than trusting it to find /opt/hostedtoolcache.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Point Gradle toolchain detection at both JDKs
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64' >> ~/.gradle/gradle.properties

      # libXray v26.7.11 declares Go 1.26.3. The patched AAR is built from
      # source below, so CI needs the same compiler rather than whichever Go
      # version happens to be preinstalled on ubuntu-latest.
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'

      # compileSdk is 37.1 — release(37) { minorApiLevel = 1 } in
      # app/build.gradle.kts and subspace.android.library. The Compose
      # 1.13.0-alpha artifacts behind the M8.6 Material 3 Expressive work require
      # it, so the package below is `platforms;android-37.1`.
      #
      # The package is minor-versioned, NOT `platforms;android-37`.
      # Google's repository2-3.xml ships android-36, android-36.1,
      # android-37.0, android-37.1 and android-37.2-beta1 — minor-versioned
      # platforms began at 36.1, and there has never been a bare android-37.
      # Asking for one fails the whole job in ~20s with a single
      # "Failed to find package" line buried under the licence text.
      #
      # This is easy to miss locally: Android Studio creates a
      # platforms/android-37 SYMLINK pointing at a minor-versioned platform, so a dev
      # machine resolves the non-existent name happily and CI does not.
      # An earlier version of this file claimed the runner "already ships
      # platforms;android-37, verified 2026-07-25". It does not, and never
      # could have — the claim was never actually checked against the
      # repository manifest. §10.5: a claim about upstream without a source
      # is a guess.
      #
      # Licences are accepted here, so AGP's own SDK auto-download can fill
      # any remaining gap rather than failing the build.
      - name: Install Android SDK platform 37
        uses: android-actions/setup-android@v4
        with:
          # NDK r29 is the version libXray's own v26.7.11 release workflow uses.
          packages: 'platform-tools platforms;android-37.1 build-tools;37.0.0 ndk;29.0.14206865'

      - uses: gradle/actions/setup-gradle@v4

      # The libXray AAR is ~95 MB and gitignored (§10.7), so a fresh clone
      # does not have it and :core:xray cannot resolve its dependency. M5 needs
      # the committed env patch; fetch-native.sh correctly refuses to replace
      # it with the stock release, so CI builds the pinned source plus patches.
      - name: Build pinned patched libXray AAR
        run: ./scripts/build-libxray.sh

      - name: Verify module boundaries, format, static analysis, licence headers
        run: ./gradlew checkAll

      # `build` (assemble + check), not `assembleDebug`: the release variant
      # is where R8/minification runs, and assembleDebug never exercises
      # that path. A missing proguard-rules.pro sat green through seven
      # task reviews for exactly this reason — every prior verification
      # used checkAll or assembleDebug, never `build`.
      #
      # `check` includes :core:ui's verifyPaparazziDebug. The committed goldens
      # were recorded on macOS; Linux font rasterisation can differ enough to
      # trip a text-heavy golden. If one fails here and not locally, that is the
      # likely cause — compare the diff image before re-recording, and do not
      # loosen the comparison threshold to make it pass.
      - name: Build (assemble + check, including the release/R8 path)
        run: ./gradlew build

      - name: Unit tests
        run: ./gradlew test
